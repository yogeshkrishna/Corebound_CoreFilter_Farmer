name: Pilot checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Engine, Android and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check Java formatting
        shell: bash
        run: |
          formatter="$RUNNER_TEMP/google-java-format.jar"
          curl --fail --silent --show-error --location 'https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar' --output "$formatter"
          printf '%s  %s\n' '812f805f58112460edf01bf202a8e61d0fd1f35c0d4fabd54220640776ec57a1' "$formatter" | sha256sum --check -
          git ls-files -z '*.java' | xargs -0 java -jar "$formatter" --dry-run --set-exit-if-changed
      - name: Test source packaging
        run: python3 -m unittest discover -s tools -p test_package.py -v
      - name: Test, lint and build
        run: ./gradlew :engine:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pilot-check-reports
          path: |
            engine/build/reports/tests
            app/build/reports
          retention-days: 14
