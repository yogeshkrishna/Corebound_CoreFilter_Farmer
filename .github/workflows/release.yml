name: Publish Android update

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify live receiver and native reconstruction
        run: |
          python -m pip install -r laptop/requirements.txt
          python -m unittest discover -s laptop/tests -v
  release:
    needs: studio
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('app/build.gradle').read_text()
          version = re.search(r"versionName\s+'([0-9]+\.[0-9]+\.[0-9]+)'", source).group(1)
          tag = 'v' + version
          if os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] != tag:
              raise SystemExit('The tag must match app/build.gradle versionName.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_TAG=' + tag + '\n')
          PY
      - name: Restore the original app signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo 'Add ANDROID_DEBUG_KEYSTORE_BASE64 before publishing. A new key cannot update existing phones.'; exit 1; }
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ceiling-scout-debug.keystore"
          chmod 600 "$RUNNER_TEMP/ceiling-scout-debug.keystore"
          printf 'SCOUT_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/ceiling-scout-debug.keystore" >> "$GITHUB_ENV"
      - name: Install pinned Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
          mkdir -p analysis/test-classes
          javac -d analysis/test-classes app/src/main/java/com/corefilter/farmer/vision/*.java app/src/main/java/com/corefilter/farmer/engine/*.java tests/*.java
          java -cp analysis/test-classes PixelVisionTest .
          java -cp analysis/test-classes NavigationReplayTest .
          mkdir -p release
          python3 laptop/package.py --output release/Ceiling-Scout-Studio.zip
          cp app/build/outputs/apk/debug/app-debug.apk release/Ceiling-Scout.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/Ceiling-Scout.apk | tee release/signature.txt
          grep -F 'Signer #1 certificate SHA-256 digest: 65aa3b42d67d26d59344b24ecc0459a97b9d9f124a9961d980d76a36137f5097' release/signature.txt
          cd release
          sha256sum Ceiling-Scout.apk > Ceiling-Scout.apk.sha256
      - name: Publish the app and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="docs/release-${RELEASE_TAG#v}.md"
          if test -f "$notes_file"; then
            gh release create "$RELEASE_TAG" release/Ceiling-Scout.apk release/Ceiling-Scout.apk.sha256 release/Ceiling-Scout-Studio.zip --title "Ceiling Scout $RELEASE_TAG" --notes-file "$notes_file" --target "$GITHUB_SHA"
          else
            gh release create "$RELEASE_TAG" release/Ceiling-Scout.apk release/Ceiling-Scout.apk.sha256 release/Ceiling-Scout-Studio.zip --title "Ceiling Scout $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
          fi
      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/ceiling-scout-debug.keystore"
