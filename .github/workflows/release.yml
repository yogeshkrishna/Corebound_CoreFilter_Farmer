name: Publish Android update

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('app/build.gradle').read_text()
          version = re.search(r"versionName\s+'([0-9]+\.[0-9]+\.[0-9]+)'", source).group(1)
          tag = 'v' + version
          if os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] != tag:
              raise SystemExit('The tag must match app/build.gradle versionName.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_TAG=' + tag + '\n')
          PY
      - name: Restore the original app signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo 'Add ANDROID_DEBUG_KEYSTORE_BASE64 before publishing. A new key cannot update existing phones.'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Install pinned Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain
          mkdir -p analysis/test-classes
          javac -d analysis/test-classes app/src/main/java/com/corefilter/farmer/vision/PixelVision.java app/src/main/java/com/corefilter/farmer/engine/FarmEngine.java app/src/main/java/com/corefilter/farmer/engine/ScreenInterpreter.java tests/PixelVisionTest.java
          java -cp analysis/test-classes PixelVisionTest .
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Ceiling-Scout.apk
          cd release
          sha256sum Ceiling-Scout.apk > Ceiling-Scout.apk.sha256
      - name: Publish the app and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release/Ceiling-Scout.apk release/Ceiling-Scout.apk.sha256 --title "Ceiling Scout $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
      - name: Remove signing key from the runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
